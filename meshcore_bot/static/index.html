<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeshCore — konsola łączności mesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/app.css?v=__ASSET_VERSION__">
</head>
<body>
  <a class="skip-link" href="#node-sections">Przejdź do listy punktów</a>
  <h1 class="visually-hidden">MeshCore — konsola łączności mesh</h1>
  <header class="top-utility-bar">
    <a class="admin-link" href="/admin">Admin</a>
    <button id="themeToggle" class="util-button" type="button" aria-label="Przełącz motyw" title="Przełącz motyw (jasny / ciemny)">☽</button>
    <span id="healthPill" class="health-pill" role="status" aria-live="polite" title="Stan połączenia z API">—</span>
  </header>
  <div class="data-error" id="dataError" role="alert" hidden>
    <span class="data-error-text"></span>
    <button type="button" class="data-error-close" id="dataErrorClose" aria-label="Zamknij komunikat">✕</button>
  </div>
  <div class="mc-util-extra" id="mcUtilExtra" role="toolbar" aria-label="Dodatkowe akcje">
    <span class="mc-countdown" id="mcCountdown" title="Następne odświeżenie"></span>
    <div class="mc-util-group" role="group" aria-label="Filtry">
      <span class="mc-util-group-label">Filtry</span>
      <button class="mc-util-btn" id="mcBtnFavOnly" type="button" title="Pokaż tylko ulubione" aria-pressed="false"><span aria-hidden="true">★</span> Ulubione</button>
      <button class="mc-util-btn" id="mcBtnWatchOnly" type="button" title="Tylko obserwowane" aria-pressed="false"><span aria-hidden="true">👁</span> Obserwowane</button>
      <button class="mc-util-btn" id="mcBtnRepeatersOnly" type="button" title="Tylko aktywne repeatery" aria-pressed="false"><span aria-hidden="true">📡</span> Repeatery</button>
    </div>
    <div class="mc-util-group" role="group" aria-label="Widoki">
      <span class="mc-util-group-label">Widoki</span>
      <button class="mc-util-btn" id="mcBtnMatrix" type="button" title="Macierz jakości linków"><span aria-hidden="true">▦</span> Macierz</button>
      <button class="mc-util-btn" id="mcBtnCompare" type="button" title="Porównaj dwa node"><span aria-hidden="true">⇄</span> Porównaj</button>
      <button class="mc-util-btn" id="mcBtnHeatmap" type="button" title="Heatmapa pokrycia" aria-pressed="false"><span aria-hidden="true">🌡</span> Heatmapa</button>
    </div>
    <div class="mc-util-group" role="group" aria-label="Eksport">
      <span class="mc-util-group-label">Eksport</span>
      <button class="mc-util-btn mc-util-btn-text" id="mcBtnCsv" type="button" title="Eksport CSV">⬇ CSV</button>
      <button class="mc-util-btn mc-util-btn-text" id="mcBtnPng" type="button" title="Zrzut mapy (PNG)">⬇ PNG</button>
    </div>
    <div class="mc-util-group" role="group" aria-label="Inne">
      <span class="mc-util-group-label">Inne</span>
      <button class="mc-util-btn" id="mcBtnNotif" type="button" title="Włącz powiadomienia o zniknięciu obserwowanych"><span aria-hidden="true">🔔</span> Alerty</button>
      <button class="mc-util-btn" id="mcBtnBlackout" type="button" title="Tryb OLED / blackout"><span aria-hidden="true">⬛</span> OLED</button>
    </div>
  </div>
  <nav class="mc-chip-bar" id="mcChipBar" aria-label="Filtry online"></nav>
  <main id="app">
    <h2 class="visually-hidden">Mapa sieci</h2>
    <div id="map" role="application" aria-label="Mapa punktów sieci mesh"></div>
    <div id="map-legend" class="overlay"></div>
    <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="sidebar" aria-expanded="true" title="Ukryj panel" aria-label="Ukryj panel"><span aria-hidden="true">›</span></button>
    <aside id="sidebar" class="overlay" aria-label="Lista punktów">
      <button id="sheet-toggle" class="sheet-toggle" type="button" aria-expanded="false"><span class="sheet-handle"></span><span class="sheet-label"></span></button>
      <section class="list-shell">
        <div id="node-sections"></div>
      </section>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="/static/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
