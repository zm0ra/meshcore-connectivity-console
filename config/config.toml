# Production/runtime config.
#
# To preserve the existing state 1:1 on the target machine, copy the whole
# `data/` directory together with this file and keep the paths below unchanged.
# That preserves:
# - SQLite database contents
# - bot identity
# - probe identity

[service]
name = "meshcore-bot"
log_level = "INFO"

[storage]
# Keep this path unchanged if you want to move the current database 1:1.
database_path = "./data/meshcore-bot.db"

[identity]
# Keep this path unchanged if you want to preserve the current bot identity.
key_file_path = "./data/identity.bin"

[probe]
# Keep this path unchanged if you want to preserve the current probe identity.
key_file_path = "./data/probe-identity-v3.bin"

# Repeater credentials and matching rules.
admin_password = "qweqwe"
admin_password_name_prefixes = ["SZN_BKO_DIR_PRZ_RPT"]
admin_password_pubkey_prefixes = []
guest_password = "hello"
default_guest_password = ""
guest_password_name_prefixes = ["SZN_BKO_DIR_PRZ_RPT"]
guest_password_pubkey_prefixes = []

# Pre-login advert is disabled in the simplified production bot/runtime.
pre_login_advert_name = ""
pre_login_advert_delay_secs = 1.0

# Probe scheduling and retry behavior.
advert_reprobe_success_cooldown_secs = 60.0
advert_reprobe_failure_cooldown_secs = 300.0
scheduled_reprobe_interval_secs = 7200.0
night_failed_retry_start_hour = 1
night_failed_retry_end_hour = 7
night_failed_retry_interval_secs = 3600.0
poll_interval_secs = 2.0
request_timeout_secs = 8.0
route_freshness_secs = 1800
neighbours_page_size = 15
neighbours_prefix_len = 4

[bot]
# Single place for channel-bot behavior.
enabled = true
# Empty means: use [service].name as the sender name on radio.
sender_name = ""
# Add or remove hashtag channels here.
channels = ["#bot-test"]
# Supported command set for the simplified bot.
enabled_commands = ["!ping", "!test", "!help"]
min_response_delay_secs = 1.0
response_attempts = 5
echo_ack_timeout_secs = 2.0
response_retry_delay_secs = 2.0
response_retry_backoff_multiplier = 2.0
response_retry_max_delay_secs = 10.0
quiet_window_secs = 8.0
command_dedup_ttl_secs = 30.0
# If true, !test includes last known SNR/RSSI from the database when available.
include_test_signal = true

[web]
host = "0.0.0.0"
port = 8080

[gateway]
# Shared Unix sockets used by bridge-gateway, neighbours-worker and bot-worker.
control_socket_path = "./data/gateway/control.sock"
event_socket_path = "./data/gateway/events.sock"

[[endpoints]]
# Primary live RS232Bridge endpoint.
name = "rpt-primary"
raw_host = "172.30.105.24"
raw_port = 5002
enabled = true
