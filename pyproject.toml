[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-bot"
version = "0.1.0"
description = "Versioned rebuild of a MeshCore TCP bot runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"cryptography>=44.0.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["meshcore_bot*"]